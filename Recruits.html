        <section class="Centrerad">

                <h2>Recruiting</h2>
                <h2>Qualities We expect</h2>
                <li>
                    <h3>Committment</h3>
                </li>
                <li>

                </li>

            <div class="Questions">

                <h2>Hiring-Process</h2>
                <br><br>
                <form class="ForTheForm">

                    <label for="name">Full Name.</label><br>
                    <input type="text" id="name" required name="name"><br><br>

                    <label for="lastname">Last Name.</label><br>
                    <input type="text" id="lastname" required name="Last name"><br><br>

                    <label for="Animation-tools">What animation tools and software are you most comfortable
                        with?</label><br>
                    <input list="Tools"  id="Animation-tools" required name="Software"><br><br>

                    <datalist id="Tools">
                        <option value="Blender"></option>
                        <option value="Adobe"></option>
                        <option value="Autodesk"></option>
                    </datalist>

                    <label for="email">Email:</label><br>
                    <input type="email" id="email" required placeholder="Name@Domain.com" name="email"><br><br>

                    <label for="Information">Tell us a little about yourself</label><br>
                    <textarea name="artikel" cols="80" rows="10" required
                        placeholder="Must fill out"></textarea><br><br>


                    <button type="submit">Submit today!</button>

                </form>
                <div>

                </div>

            </div>


        </section>
